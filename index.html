<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超インフレRNGゲーム</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        /* ヘッダーエリア */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .header-center {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #30363d;
        }
        #best-roll-display {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        #total-rolls {
            font-size: 16px;
            color: #8b949e;
            font-weight: bold;
        }
        .stats-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #coin-display {
            font-size: 18px;
            font-weight: bold;
            color: #ffcc00;
            background: rgba(255, 204, 0, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 204, 0, 0.2);
        }
        /* 中央表示エリア */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        #result-card {
            text-align: center;
            animation: popIn 0.3s ease-out;
        }
        #result-number {
            font-size: 64px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
            transition: color 0.2s;
            word-break: break-all;
            max-width: 90vw;
            line-height: 1.2;
        }
        /* 最下部操作エリア */
        footer {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            z-index: 10;
        }
        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
        }
        .action-btn {
            flex: 1;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        #roll-btn {
            background: linear-gradient(135deg, #238636, #2ea44f);
            color: white;
        }
        #roll-btn:disabled {
            background: #21262d;
            color: #8b949e;
            cursor: not-allowed;
        }
        #auto-btn {
            background: #388bfd;
            color: white;
        }
        #auto-btn.active {
            background: #da3633;
        }
        /* クールダウンバー */
        .cooldown-container {
            width: 100%;
            height: 6px;
            background-color: #21262d;
            border-radius: 3px;
            overflow: hidden;
        }
        #cooldown-bar {
            width: 0%;
            height: 100%;
            background-color: #2ea44f;
            transition: width linear;
        }
        /* パネル共通 */
        .panel {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 320px;
            background-color: #161b22;
            border-right: 1px solid #30363d;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        #inventory-panel { left: 0; transform: translateX(-100%); }
        #inventory-panel.open { transform: translateX(0); }
        #upgrade-panel { right: 0; transform: translateX(100%); border-right: none; border-left: 1px solid #30363d; box-shadow: -5px 0 15px rgba(0,0,0,0.5); }
        #upgrade-panel.open { transform: translateX(0); }
        
        .panel-header {
            padding: 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .item-row, .upg-card {
            background-color: #21262d;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .upg-card h4 { color: #fff; margin-bottom: 5px; }
        .upg-card p { font-size: 13px; color: #8b949e; margin-bottom: 10px; }
        
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <button class="btn" id="open-inv-btn" onclick="togglePanel('inventory-panel', true)">🎒 インベントリ</button>
        <div class="header-center">
            <div id="best-roll-display">👑 Best: 1</div>
            <div id="total-rolls">⭐ Total Rolls: 0</div>
        </div>
        <div class="stats-group">
            <div id="coin-display">🪙 0</div>
            <button class="btn" onclick="togglePanel('upgrade-panel', true)">🆙 強化</button>
        </div>
    </header>

    <!-- 中央ガチャ表示 -->
    <main>
        <div id="result-card">
            <div id="result-number">1</div>
        </div>
    </main>

    <!-- 最下部操作UI -->
    <footer>
        <div class="controls">
            <button class="action-btn" id="roll-btn" onclick="triggerRoll()">ROLL</button>
            <button class="action-btn" id="auto-btn" onclick="toggleAuto()">AUTO: OFF</button>
        </div>
        <div class="cooldown-container">
            <div id="cooldown-bar"></div>
        </div>
    </footer>

    <!-- 左インベントリパネル -->
    <div class="panel" id="inventory-panel">
        <div class="panel-header">
            <h3>🎒 インベントリ</h3>
            <button class="btn" onclick="togglePanel('inventory-panel', false)">×</button>
        </div>
        <div class="panel-content" id="inventory-list"></div>
    </div>

    <!-- 右アップグレードツリーパネル -->
    <div class="panel" id="upgrade-panel">
        <div class="panel-header">
            <h3>🆙 無限強化ツリー</h3>
            <button class="btn" onclick="togglePanel('upgrade-panel', false)">×</button>
        </div>
        <div class="panel-content">
            <div class="upg-card">
                <h4>⚡ タイムリープ (速度UP)</h4>
                <p>ロールの待ち時間を短縮します。</p>
                <div id="speed-level">Lv.0</div>
                <button class="btn" style="width:100%; margin-top:8px;" id="buy-speed-btn" onclick="buyUpgrade('speed')">コスト: 10 🪙</button>
            </div>
            <div class="upg-card">
                <h4>🍀 フォーチュン・オーラ (幸運度UP)</h4>
                <p>より大きな数字が出やすくなります。</p>
                <div id="luck-level">Lv.0</div>
                <button class="btn" style="width:100%; margin-top:8px;" id="buy-luck-btn" onclick="buyUpgrade('luck')">コスト: 15 🪙</button>
            </div>
        </div>
    </div>

    <script>
        // 超インフレレアリティプール (最大 Septillion = 10^24)
        const pool = [
            { value: "1,000,000,000,000,000,000,000,000", num: 1e24, color: '#ff3e6c' }, // Septillion
            { value: "1,000,000,000,000,000,000,000",     num: 1e21, color: '#ff4500' }, // Sextillion
            { value: "1,000,000,000,000,000,000",         num: 1e18, color: '#ff8800' }, // Quintillion
            { value: "1,000,000,000,000,000",             num: 1e15, color: '#ffcc00' }, // Quadrillion
            { value: "1,000,000,000,000",                 num: 1e12, color: '#d3ff00' }, // Trillion
            { value: "1,000,000,000",                     num: 1e9,  color: '#00ffcc' }, // Billion
            { value: "1,000,000",                         num: 1e6,  color: '#a371f7' }, // Million
            { value: "100,000",                           num: 1e5,  color: '#58a6ff' },
            { value: "10,000",                            num: 1e4,  color: '#3fb950' },
            { value: "1,000",                             num: 1000, color: '#1f6feb' },
            { value: "100",                               num: 100,  color: '#536eff' },
            { value: "25",                                num: 25,   color: '#6e7681' },
            { value: "10",                                num: 10,   color: '#8b949e' },
            { value: "5",                                 num: 5,    color: '#aaaaaa' },
            { value: "1",                                 num: 1,    color: '#ffffff' }
        ];

        // ビッグナンバー同士の文字列等価チェック等のためのベースキー
        let state = {
            rolls: 0,
            coins: 0,
            bestRoll: "1",
            bestRollNum: 1,
            inventory: {},
            upgrades: { speed: 0, luck: 0 }
        };

        let isRolling = false;
        let isAuto = false;

        function saveGame() {
            localStorage.setItem('rng_game_save_septillion_coins', JSON.stringify(state));
        }

        function loadGame() {
            const saved = localStorage.getItem('rng_game_save_septillion_coins');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.rolls !== undefined) state.rolls = parsed.rolls;
                    if (parsed.coins !== undefined) state.coins = parsed.coins;
                    if (parsed.bestRoll !== undefined) state.bestRoll = parsed.bestRoll;
                    if (parsed.bestRollNum !== undefined) state.bestRollNum = parsed.bestRollNum;
                    if (parsed.inventory) state.inventory = parsed.inventory;
                    if (parsed.upgrades) state.upgrades = parsed.upgrades;
                } catch(e) { console.error(e); }
            }
            updateUI();
        }

        function togglePanel(id, show) {
            document.getElementById(id).classList.toggle('open', show);
            if (id === 'inventory-panel') {
                document.getElementById('open-inv-btn').style.visibility = show ? 'hidden' : 'visible';
            }
        }

        function getBaseCooldown() {
            return Math.max(200, 1000 - (state.upgrades.speed * 80)); 
        }

        // 幸運マルチプライヤー
        function getLuckMultiplier() {
            return 1 + (state.upgrades.luck * 0.35);
        }

        // 指数関数コスト計算（コインベース）
        function getUpgradeCost(type) {
            const lv = state.upgrades[type];
            if (type === 'speed') return Math.floor(10 * Math.pow(2.2, lv));
            if (type === 'luck') return Math.floor(15 * Math.pow(2.5, lv));
        }

        // フォーマット表示用関数
        function formatNumber(num) {
            return num.toLocaleString();
        }

        function updateUI() {
            document.getElementById('total-rolls').innerText = `⭐ Total Rolls: ${state.rolls.toLocaleString()}`;
            document.getElementById('best-roll-display').innerText = `👑 Best: ${state.bestRoll}`;
            document.getElementById('coin-display').innerText = `🪙 ${formatNumber(state.coins)}`;
            
            // 強化表示
            document.getElementById('speed-level').innerText = `Lv.${state.upgrades.speed}`;
            document.getElementById('buy-speed-btn').innerText = `コスト: ${formatNumber(getUpgradeCost('speed'))} 🪙`;
            document.getElementById('luck-level').innerText = `Lv.${state.upgrades.luck} (+${Math.round((getLuckMultiplier()-1)*100)}%)`;
            document.getElementById('buy-luck-btn').innerText = `コスト: ${formatNumber(getUpgradeCost('luck'))} 🪙`;

            // インベントリ表示
            const invList = document.getElementById('inventory-list');
            invList.innerHTML = '';
            pool.forEach(p => {
                const count = state.inventory[p.value] || 0;
                if (count > 0) {
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.style.borderLeft = `5px solid ${p.color}`;
                    row.innerHTML = `<span style="color:${p.color}; font-weight:bold;">${p.value}</span> : ${count.toLocaleString()} 個`;
                    invList.appendChild(row);
                }
            });
        }

        function buyUpgrade(type) {
            const cost = getUpgradeCost(type);
            if (state.coins >= cost) {
                state.coins -= cost;
                state.upgrades[type]++;
                saveGame();
                updateUI();
            } else {
                alert("コインが足りません！");
            }
        }

        function triggerRoll() {
            if (isRolling) return;
            isRolling = true;
            document.getElementById('roll-btn').disabled = true;

            state.rolls++;
            
            const luck = getLuckMultiplier();
            let rolledItem = pool[pool.length - 1]; // デフォルトは1

            for (let i = 0; i < pool.length; i++) {
                // 基礎確率にLuck倍率を乗算
                let finalChance = (1 / pool[i].num) * luck;
                if (Math.random() < finalChance) {
                    rolledItem = pool[i];
                    break;
                }
            }

            // 引いた数値をコインとして加算！
            state.coins += rolledItem.num;

            // インベントリ登録
            state.inventory[rolledItem.value] = (state.inventory[rolledItem.value] || 0) + 1;
            
            // 最高記録チェック
            if (rolledItem.num > state.bestRollNum) {
                state.bestRollNum = rolledItem.num;
                state.bestRoll = rolledItem.value;
            }
            
            saveGame();

            // 演出
            const display = document.getElementById('result-number');
            display.innerText = rolledItem.value;
            display.style.color = rolledItem.color;
            display.style.textShadow = `0 0 25px ${rolledItem.color}`;
            
            const card = document.getElementById('result-card');
            card.style.animation = 'none';
            card.offsetHeight;
            card.style.animation = 'popIn 0.2s ease-out';

            updateUI();

            // クールダウンゲージ
            const cdTime = getBaseCooldown();
            const bar = document.getElementById('cooldown-bar');
            bar.style.transition = 'none';
            bar.style.width = '100%';
            bar.offsetHeight;
            bar.style.transition = `width ${cdTime}ms linear`;
            bar.style.width = '0%';

            setTimeout(() => {
                isRolling = false;
                document.getElementById('roll-btn').disabled = false;
                if (isAuto) runAutoStep();
            }, cdTime);
        }

        function toggleAuto() {
            isAuto = !isAuto;
            const btn = document.getElementById('auto-btn');
            if (isAuto) {
                btn.innerText = "AUTO: ON";
                btn.classList.add('active');
                if (!isRolling) runAutoStep();
            } else {
                btn.innerText = "AUTO: OFF";
                btn.classList.remove('active');
            }
        }

        function runAutoStep() {
            if (!isAuto) return;
            triggerRoll();
        }

        loadGame();
    </script>
</body>
</html>
