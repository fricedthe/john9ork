<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>runug</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .center-stats {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        #best-roll-display {
            font-size: 26px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        #total-rolls {
            font-size: 16px;
            color: #8b949e;
        }
        .right-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #coin-display {
            font-size: 18px;
            font-weight: bold;
            color: #ffcc00;
        }
        .btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #30363d; }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        #result-card {
            text-align: center;
        }
        #result-number {
            font-size: 56px;
            font-weight: 900;
            color: #fff;
            word-break: break-all;
            padding: 0 20px;
            transition: color 0.2s;
        }
        footer {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            z-index: 10;
        }
        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
        }
        .action-btn {
            flex: 1;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .action-btn:active { transform: scale(0.98); }
        #roll-btn {
            background: linear-gradient(135deg, #238636, #2ea44f);
            color: white;
        }
        #roll-btn:disabled {
            background: #21262d;
            color: #8b949e;
            cursor: not-allowed;
        }
        #auto-btn {
            background: #388bfd;
            color: white;
        }
        #auto-btn.active { background: #da3633; }
        .cooldown-container {
            width: 100%;
            height: 6px;
            background-color: #21262d;
            border-radius: 3px;
            overflow: hidden;
        }
        #cooldown-bar {
            width: 0%;
            height: 100%;
            background-color: #2ea44f;
            transition: width linear;
        }
        .panel {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 320px;
            background-color: #161b22;
            border-right: 1px solid #30363d;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        #inventory-panel { left: 0; transform: translateX(-100%); }
        #inventory-panel.open { transform: translateX(0); }
        #upgrade-panel { right: 0; transform: translateX(100%); border-right: none; border-left: 1px solid #30363d; box-shadow: -5px 0 15px rgba(0,0,0,0.5); }
        #upgrade-panel.open { transform: translateX(0); }
        .panel-header {
            padding: 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .item-row, .upg-card {
            background-color: #21262d;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .upg-card h4 { color: #fff; margin-bottom: 5px; }
        .upg-card p { font-size: 13px; color: #8b949e; margin-bottom: 10px; }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <button class="btn" id="open-inv-btn" onclick="togglePanel('inventory-panel', true)">🎒 インベントリ</button>
        <div class="center-stats">
            <div id="best-roll-display">👑 Best: 1</div>
            <div id="total-rolls">⭐ Total Rolls: 0</div>
        </div>
        <div class="right-group">
            <div id="coin-display">🪙 0</div>
            <button class="btn" onclick="togglePanel('upgrade-panel', true)">🚽 強化</button>
        </div>
    </header>
    <main>
        <div id="result-card">
            <div id="result-number">1</div>
        </div>
    </main>
    <footer>
        <div class="controls">
            <button class="action-btn" id="roll-btn" onclick="triggerRoll()">ROLL</button>
            <button class="action-btn" id="auto-btn" onclick="toggleAuto()">AUTO: OFF</button>
        </div>
        <div class="cooldown-container">
            <div id="cooldown-bar"></div>
        </div>
    </footer>
    <div class="panel" id="inventory-panel">
        <div class="panel-header">
            <h3>🎒 インベントリ</h3>
            <button class="btn" onclick="togglePanel('inventory-panel', false)">×</button>
        </div>
        <div class="panel-content" id="inventory-list"></div>
    </div>
    <div class="panel" id="upgrade-panel">
        <div class="panel-header">
            <h3>🚽 無限強化ツリー</h3>
            <button class="btn" onclick="togglePanel('upgrade-panel', false)">×</button>
        </div>
        <div class="panel-content">
            <div class="upg-card">
                <h4>⚡ スピード加速器 （？）</h4>
                <p>ロールのクールダウンを減らします。</p>
                <div id="speed-level">Lv.0</div>
                <button class="btn" style="width:100%; margin-top:8px;" id="buy-speed-btn" onclick="buyUpgrade('speed')">コスト: 10 🪙</button>
            </div>
            <div class="upg-card">
                <h4>🍀 ラック上昇機 （？）</h4>
                <p>よりいいやつが出やすくなります。</p>
                <div id="luck-level">Lv.0</div>
                <button class="btn" style="width:100%; margin-top:8px;" id="buy-luck-btn" onclick="buyUpgrade('luck')">コスト: 15 🪙</button>
            </div>
        </div>
    </div>
    <script>
        const pool = [
            { value: 1000000000000000000000000, chance: 1 / 2300000000000000000000, color: '#ff3e3e' },
            { value: 1000000000000000000000,    chance: 1 / 19000000000000000000,    color: '#ff6b6b' },
            { value: 1000000000000000000,       chance: 1 / 6000000000000000,       color: '#ff9494' },
            { value: 1000000000000000,          chance: 1 / 8000000000000,          color: '#ffbaba' },
            { value: 1000000000000,             chance: 1 / 7000000000,             color: '#ff7b00' },
            { value: 1000000000,                chance: 1 / 7000000,                color: '#ffcc00' },
            { value: 1000000,                   chance: 1 / 150000,                   color: '#a371f7' },
            { value: 100000,                    chance: 1 / 7500,                    color: '#58a6ff' },
            { value: 10000,                     chance: 1 / 1000,                     color: '#3fb950' },
            { value: 1000,                      chance: 1 / 800,                      color: '#1f6feb' },
            { value: 100,                       chance: 1 / 100,                       color: '#6e7681' },
            { value: 25,                        chance: 1 / 25,                        color: '#8b949e' },
            { value: 5,                         chance: 1 / 5,                         color: '#c9d1d9' },
            { value: 1,                         chance: 1 / 1,                         color: '#ffffff' }
        ];

        let state = {
            rolls: 0,
            bestRoll: 1,
            coins: 0,
            inventory: {},
            upgrades: { speed: 0, luck: 0 }
        };

        let isRolling = false;
        let isAuto = false;

        function saveGame() {
            localStorage.setItem('rng_game_save_final', JSON.stringify(state));
        }

        function loadGame() {
            const saved = localStorage.getItem('rng_game_save_final');
            if (saved) {
                try {
                    state = JSON.parse(saved);
                    if (!state.inventory) state.inventory = {};
                    if (!state.upgrades) state.upgrades = { speed: 0, luck: 0 };
                } catch(e) { console.error(e); }
            }
            updateUI();
        }

        function togglePanel(id, show) {
            document.getElementById(id).classList.toggle('open', show);
            if (id === 'inventory-panel') {
                document.getElementById('open-inv-btn').style.visibility = show ? 'hidden' : 'visible';
            }
        }

        function getBaseCooldown() {
            return Math.max(200, 1000 - (state.upgrades.speed * 80)); 
        }

        function getLuckMultiplier() {
            return 3 + (state.upgrades.luck * 0.5);
        }

        function getUpgradeCost(type) {
            const lv = state.upgrades[type];
            if (type === 'speed') return Math.floor(10 * Math.pow(1.8, lv));
            if (type === 'luck') return Math.floor(15 * Math.pow(2.0, lv));
        }

        function updateUI() {
            document.getElementById('total-rolls').innerText = `⭐ Total Rolls: ${state.rolls.toLocaleString()}`;
            document.getElementById('best-roll-display').innerText = `👑 Best: ${state.bestRoll.toLocaleString()}`;
            document.getElementById('coin-display').innerText = `🪙 ${state.coins.toLocaleString()}`;
            
            document.getElementById('speed-level').innerText = `Lv.${state.upgrades.speed}`;
            document.getElementById('buy-speed-btn').innerText = `コスト: ${getUpgradeCost('speed').toLocaleString()} 🪙`;
            document.getElementById('luck-level').innerText = `Lv.${state.upgrades.luck} (幸運: +${Math.round((getLuckMultiplier()) * 100)}%)`;
            document.getElementById('buy-luck-btn').innerText = `コスト: ${getUpgradeCost('luck').toLocaleString()} 🪙`;

            const invList = document.getElementById('inventory-list');
            invList.innerHTML = '';
            pool.forEach(p => {
                const count = state.inventory[p.value] || 0;
                if (count > 0) {
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.style.borderLeft = `5px solid ${p.color}`;
                    row.innerHTML = `<span style="color:${p.color}; font-weight:bold;">${p.value.toLocaleString()}</span> : ${count.toLocaleString()} 個`;
                    invList.appendChild(row);
                }
            });
        }

        function buyUpgrade(type) {
            const cost = getUpgradeCost(type);
            if (state.coins >= cost) {
                state.coins -= cost;
                state.upgrades[type]++;
                saveGame();
                updateUI();
            } else {
                alert("コイン(🪙)が足りません！ガチャを回して数字を稼ぎましょう！");
            }
        }

        function triggerRoll() {
            if (isRolling) return;
            isRolling = true;
            document.getElementById('roll-btn').disabled = true;

            state.rolls++;
            
            const luck = getLuckMultiplier();
            let rolledItem = pool[pool.length - 1]; 

            for (let i = 0; i < pool.length; i++) {
                if (Math.random() < (pool[i].chance * luck)) {
                    rolledItem = pool[i];
                    break;
                }
            }

            state.coins += rolledItem.value;
            state.inventory[rolledItem.value] = (state.inventory[rolledItem.value] || 0) + 1;
            
            if (rolledItem.value > state.bestRoll) {
                state.bestRoll = rolledItem.value;
            }
            
            saveGame();

            const display = document.getElementById('result-number');
            display.innerText = rolledItem.value.toLocaleString();
            display.style.color = rolledItem.color;
            display.style.textShadow = `0 0 25px ${rolledItem.color}`;
            
            const card = document.getElementById('result-card');
            card.style.animation = 'none';
            card.offsetHeight; 
            card.style.animation = 'popIn 0.15s ease-out';

            updateUI();

            const cdTime = getBaseCooldown();
            const bar = document.getElementById('cooldown-bar');
            bar.style.transition = 'none';
            bar.style.width = '100%';
            bar.offsetHeight;
            bar.style.transition = `width ${cdTime}ms linear`;
            bar.style.width = '0%';

            setTimeout(() => {
                isRolling = false;
                document.getElementById('roll-btn').disabled = false;
                if (isAuto) runAutoStep();
            }, cdTime);
        }

        function toggleAuto() {
            isAuto = !isAuto;
            const btn = document.getElementById('auto-btn');
            if (isAuto) {
                btn.innerText = "AUTO: ON";
                btn.classList.add('active');
                if (!isRolling) runAutoStep();
            } else {
                btn.innerText = "AUTO: OFF";
                btn.classList.remove('active');
            }
        }

        function runAutoStep() {
            if (!isAuto) return;
            triggerRoll();
        }

        loadGame();
    </script>
</body>
</html>
